<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>قرار مهدی و مهدیس</title>

<style>

*{
box-sizing:border-box;
font-family:tahoma;
}

body{
margin:0;
height:100vh;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#ff758c,#ff7eb3,#8e54e9);
}

.heart{
position:absolute;
font-size:25px;
animation:float 8s infinite linear;
opacity:.7;
}

@keyframes float{
0%{
transform:translateY(110vh);
}
100%{
transform:translateY(-10vh) rotate(360deg);
}
}

.card{

width:90%;
max-width:430px;
padding:35px 25px;
border-radius:30px;
background:rgba(255,255,255,.2);
backdrop-filter:blur(20px);
box-shadow:0 20px 50px rgba(0,0,0,.25);
text-align:center;
color:white;

}

h1{
font-size:28px;
}

p{
font-size:20px;
line-height:2;
}

button{

padding:14px 35px;
border:none;
border-radius:50px;
font-size:18px;
margin:8px;
cursor:pointer;

}

.yes{

background:#ff3366;
color:white;

}

.no{

background:#ddd;
color:#777;

}

input{

padding:15px;
width:90%;
border-radius:20px;
border:none;
font-size:16px;

}

.hidden{
display:none;
}

</style>

</head>


<body>


<div class="heart" style="left:10%">❤️</div>
<div class="heart" style="left:30%;animation-delay:2s">💗</div>
<div class="heart" style="left:60%;animation-delay:4s">💖</div>
<div class="heart" style="left:85%;animation-delay:1s">❤️</div>



<div class="card">


<div id="page1">

<h1>یه سوال از مهدیس 😄</h1>

<p>

مهدیس،
<br>
میشه با مهدی یه قرار بریم؟

</p>


<button class="yes" onclick="accept()">
آره 😄
</button>

<button class="no" disabled>
نه 😅
</button>


</div>




<div id="page2" class="hidden">


<h1>خب عالی شد 😄</h1>

<p>

کی وقت داریم بریم؟

</p>


<input type="datetime-local">

<br><br>


<button class="yes" onclick="next()">
ثبت
</button>


</div>





<div id="page3" class="hidden">


<h1>یه سوال آخر 😁</h1>


<p>

مکان پیشنهادی:
<br><br>
🏠 خونه‌ی من
<br><br>
مهدیس، خوبه؟

</p>



<button class="yes" onclick="finish()">
آره 😄
</button>


<button class="no" onclick="noPlace()">
نه 😅
</button>



</div>





<div id="page4" class="hidden">


<h1>اوکی شد 👌</h1>


<p>

پس هماهنگ شد مهدیس 😄
<br><br>
زمانش رو باهم تنظیم می‌کنیم.

</p>


</div>



</div>




<script>


function accept(){

document.getElementById("page1").classList.add("hidden");

document.getElementById("page2").classList.remove("hidden");

}



function next(){

document.getElementById("page2").classList.add("hidden");

document.getElementById("page3").classList.remove("hidden");

}



function finish(){

document.getElementById("page3").classList.add("hidden");

document.getElementById("page4").classList.remove("hidden");

}



function noPlace(){

document.getElementById("page3").innerHTML=

`

<h1>😂 باشه</h1>

<p>
خونه شما پسس خوبه😁
</p>

`;

}


</script>


</body>
</html>
